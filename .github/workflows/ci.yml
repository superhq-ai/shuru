name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sdk-unit:
    name: SDK unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: packages/sdk
      - run: bun test test/unit/
        working-directory: packages/sdk

  sdk-lint:
    name: SDK lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install
        working-directory: packages/sdk
      - run: bunx --bun @biomejs/biome check src/
        working-directory: packages/sdk

  rust-check:
    name: Rust check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p shuru-cli

  linux-test:
    name: Linux tests (${{ matrix.runner }})
    strategy:
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p shuru-proto -p shuru-linux -p shuru-node -p shuru-vm -p shuru-desktop
      # Exec sessions run in cgroups of their own, which only root can make.
      - run: cargo test -p shuru-guest
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: sudo -E
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo -E
