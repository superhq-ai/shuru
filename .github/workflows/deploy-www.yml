name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - "www/**"
      - "install.sh"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: ./www
        run: bun install --frozen-lockfile

      - name: Copy install script
        run: cp install.sh www/public/install.sh

      - name: Build
        working-directory: ./www
        run: bun run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./www/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
