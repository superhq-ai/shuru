[package]
name = "shuru-node"
version = "0.1.0"
edition = "2021"
description = "Runs shuru VMs on a Linux node, one jailed VMM per sandbox"
license = "Apache-2.0"
repository = "https://github.com/superhq-ai/shuru"
publish = false

[[bin]]
name = "shuru-node"
path = "src/main.rs"

[dependencies]
shuru-linux = { path = "../shuru-linux" }
shuru-proto = { path = "../shuru-proto" }
shuru-proxy = { path = "../shuru-proxy" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
kvm-bindings = "0.9"
libc = "0.2"
seccompiler = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "signal"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
