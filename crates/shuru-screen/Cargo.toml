[package]
name = "shuru-screen"
version = "0.2.5"
edition = "2021"
description = "Streams an X11 display as H.264 over a WebSocket on a unix socket, with gated XTEST input"
license = "Apache-2.0"
repository = "https://github.com/superhq-ai/shuru"
publish = false
# The vendored x264 bindings (see build.rs) expose DEP_SHURU_SCREEN_RPATH.
links = "shuru-screen"

[[bin]]
name = "shuru-screen"
path = "src/main.rs"

# Linux only. On other systems the binary only says so, which keeps
# `cargo build --workspace` working there.
[target.'cfg(target_os = "linux")'.dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
log = "0.4"
env_logger = "0.11"
parking_lot = "0.12"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "signal"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
x11rb = { version = "0.13", features = ["shm", "damage", "xfixes", "xtest", "shape", "xinput", "randr", "allow-unsafe-code"] }

[target.'cfg(all(target_os = "linux", unix))'.dependencies]
nix = { version = "0.31", features = ["fs", "poll", "time"] }

[build-dependencies]
bindgen = "0.72"
pkg-config = "0.3"
